name: Quant Screener Scan

on:
  schedule:
    # 21:45 UTC ≈ shortly after the US market close - adjust for DST as needed
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --notify

      - name: Commit updated signals
        run: |
          git config user.name "quant-screener-bot"
          git config user.email "actions@github.com"
          git add outputs/signals.csv
          git diff --cached --quiet || git commit -m "chore: update scan results [skip ci]"
          git push
